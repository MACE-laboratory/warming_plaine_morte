name: warming_plaine_morte

channels:
  - r
  - bioconda
  - conda-forge
  - defaults

dependencies:
  - r-base=4.4.3
  - r-essentials=4.4

  # Core tidyverse / analysis
  - r-tidyverse=2.0.0
  - r-ggplot2=3.5.2
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-purrr=1.0.4
  - r-stringr=1.5.1
  - r-forcats=1.0.0

  # Data & stats
  - r-data.table=1.17.4
  - r-matrix=1.7.3
  - r-lme4=1.1.37
  - r-glmnet=4.1.10
  - r-caret=6.0.94
  - r-survival=3.8.3
  - r-randomforest=4.7.1.2
  - r-rpart=4.1.24

  # Visualization
  - r-cowplot=1.1.3
  - r-gridextra=2.3
  - r-ggpubr=0.6.0
  - r-ggrepel=0.9.6

  # Ecology / multivariate
  - r-vegan=2.7.1
  - r-phyloseq=1.50.0
  - r-ape=5.8.1

  # Bioconductor core ecosystem
  - bioconductor-biobase=2.66.0
  - bioconductor-biocgenerics=0.52.0
  - bioconductor-biocparallel=1.40.0
  - bioconductor-summarizedexperiment=1.36.0
  - bioconductor-iranges=2.40.0
  - bioconductor-genomicranges=1.58.0
  - bioconductor-s4vectors=0.44.0

  # Microbiome / sequencing
  - bioconductor-microbiome=1.28.0
  - bioconductor-phyloseq=1.50.0
  - bioconductor-biostrings=2.74.0

  # HDF5 / data formats
  - bioconductor-rhdf5=2.50.0
  - bioconductor-rhdf5lib=1.28.0

  # Utilities
  - r-rmarkdown=2.29
  - r-knitr=1.50
  - r-jsonlite=2.0.0
  - r-httr=1.4.7
  - r-devtools=2.4.5
  - r-testthat=3.2.3