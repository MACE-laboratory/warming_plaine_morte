name: warming_plaine_morte

# MAIN environment: every analysis script EXCEPT the DEP2 proteomics
# normalisation (6_a2_impute_normalise_proteins.R), which uses its own env:
#   envs/warming_plaine_morte_dep2.yml
#
# Only conda-forge + bioconda are meant to be used. Do NOT add the `r` or
# `defaults` channels: mixing them with conda-forge breaks R builds. If your conda
# adds `defaults` from ~/.condarc, run once:  conda config --set channel_priority strict
channels:
  - conda-forge
  - bioconda

dependencies:
  # ---------------------------------------------------------------- R itself
  - r-base=4.4
  - r-recommended            # mgcv, MASS, Matrix, nlme, survival, lattice ...
  - r-remotes                # used by install_github_packages.R
  - r-withr
  - compilers                # needed for the few source (GitHub) installs
  - make
  - pkg-config

  # ---------------------------------------------------- tidyverse / data wrangling
  # (versions marked =x.y were already pinned in the previous env files; kept so
  #  that figures/statistics stay comparable)
  - r-tidyverse=2.0
  - r-ggplot2=3.5            # pinned < 4.0: scripts use size=/..eq.label.. idioms
  - r-dplyr=1.1
  - r-tidyr=1.3
  - r-readr=2.1
  - r-purrr=1.0
  - r-stringr=1.5
  - r-tibble
  - r-reshape2
  - r-data.table=1.17
  - r-jsonlite

  # ------------------------------------------------------------ plotting
  - r-ggpubr=0.6
  - r-ggrepel=0.9
  - r-ggsignif
  - r-cowplot=1.1
  - r-patchwork
  - r-ggridges
  - r-ggthemes
  - r-ggstance
  - r-ggeffects
  - r-ggraph
  - r-igraph
  - r-ggtext
  - r-scales
  - r-paletteer
  - r-rcolorbrewer
  - bioconductor-ggtree      # must resolve to 3.x (4.x needs ggplot2 >= 4)

  # ---------------------------------------------- statistics / modelling
  - r-vegan=2.7
  - r-performance
  - r-compositions
  - r-rstatix
  - r-coin
  - r-hmisc
  - r-broom
  - r-lme4
  - r-ape=5.8
  - r-seqinr

  # -------------------------------------------------- Bioconductor 3.20 (R 4.4)
  - bioconductor-phyloseq
  - bioconductor-genomeinfodbdata   # not declared as a dependency by GenomeInfoDb on bioconda -> load errors without it
  - bioconductor-microbiome
  - bioconductor-keggrest
  - bioconductor-biostrings
  - bioconductor-decipher

  # NOT on conda (or not for every platform, e.g. osx-arm64) -> installed from a
  # date-pinned CRAN snapshot by envs/install_github_packages.R:
  #   gratia, khroma, spaa, metacoder, taxonomizr

  # ---- ANCOMBC: dependencies only. The package itself is installed from GitHub
  # ---- (pinned commit) by envs/install_github_packages.R
  - r-cvxr=1.0               # ANCOMBC (2025 commits) breaks with CVXR >= 1.8
  - r-desctools
  - r-doparallel
  - r-dorng
  - r-energy
  - r-foreach
  - r-gtools
  - r-lmertest
  - r-multcomp
  - r-nloptr
  - r-quadprog
  - r-rdpack
